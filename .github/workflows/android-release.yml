name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle wrapper execution
        run: chmod +x ./gradlew

      # Pull requests and ordinary branch pushes receive a debug APK.
      # Signing secrets are used only for tag pushes or manual runs.
      - name: Assemble debug APK
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: SignBridge-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify release signing secrets
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Assemble unsigned release APK
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Align, sign, and verify release APK
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="$(mktemp -d)"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/signing.jks"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$unsigned" ]; then
            echo "Expected unsigned release APK not found: $unsigned" >&2
            exit 1
          fi
          mkdir -p app/build/outputs/apk/signed
          aligned="$signing_dir/app-release-aligned.apk"
          output="app/build/outputs/apk/signed/SignBridge-release-signed.apk"
          "$build_tools/zipalign" -f -p 4 "$unsigned" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$signing_dir/signing.jks" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$output" "$aligned"
          "$build_tools/apksigner" verify --verbose --print-certs "$output"

      - name: Upload signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: SignBridge-signed-${{ github.run_number }}
          path: app/build/outputs/apk/signed/SignBridge-release-signed.apk
          if-no-files-found: error
          retention-days: 30
